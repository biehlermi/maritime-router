# Supporting cases: Wadden Sea harbours reached through tidal channels must
# stay reachable when tidal flats are blocked ([water] exclude_tidal_flats).
# Each case routes from a ferry terminal or harbour (OSM feature, Geofabrik
# extracts of 2026-10-15) to open water outside the islands, with a snap
# distance of at most 500 m, so a harbour whose channel the flats close fails
# (no_water_nearby or no_route) instead of snapping kilometres away.
#
#   maritime-router-cli test --data phase1.mrd testdata/wadden-harbours.yaml --out results-wadden/
#
# Known failures on the Phase-1 build (no OSM fairway line to reopen them;
# candidates for curated corridors or overrides):
#   - Tönning: the Eider above the barrage is covered by tidal flats from bank to bank in OSM and has no fairway line.
#   - Husum: no OSM fairway line leads to Husum (the nearest is 14 km away); the harbour basin was already 1.5 km from the model's water in PR 8.

defaults:
  distance_tolerance: 0.10

cases:
  - id: w01-den-helder
    title: Den Helder (Veerhaven) → open sea
    waypoints:
      - name: Den Helder (Veerhaven)
        lat: 52.9628
        lon: 4.7780
        source: OSM node 1328957096 amenity=ferry_terminal "Veerhaven Den Helder" (node position, rounded to 4 decimals)
      - name: North Sea off Vlieland
        lat: 53.55
        lon: 4.9
    options:
      max_snap_distance_m: 500

