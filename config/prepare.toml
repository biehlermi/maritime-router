# Parameters for `maritime-router-prepare build`.
# Every value here is hashed into the data file header, so a data file always
# records exactly how it was built. Defaults are start values, tuned in Phase 1.

[region]
# Bounding box to build: [min_lon, min_lat, max_lon, max_lat] in WGS84 degrees.
# Omit for a global build.
# bbox = [-75.0, 35.0, 32.0, 72.0]
# More boxes for a multi-region build (the region is the union of all boxes;
# `--bbox` on the command line replaces them all).
# bboxes = [[-6.5, 48.5, 31.5, 71.5], [-75.0, 38.5, -6.5, 56.0]]

[grid]
# Cell size limits (metres). Cells are split while they contain both water and
# land, down to the minimum size allowed for their region.
ocean_min_cell_m = 2400        # open ocean beyond the coastal band
coastal_min_cell_m = 38        # within the coastal band, inland and passage water
harbour_min_cell_m = 19        # inside harbour areas and around extra points
max_cell_km = 40               # cap on leaf size, keeps the cell-centre graph a good metric
coastal_band_km = 20           # distance from land where coastal detail applies
cells_across_channel = 4       # width-adaptive refinement: at least this many cells across any channel
tile_halo_m = 4000             # context around each ~40 km build tile; shore distances saturate here (>= shore_preferred_distance_m)

[water]
inland_min_width_m = 150       # inland water narrower than this is removed (morphological opening)
harbour_min_width_m = 30       # harbour water narrower than this is removed
include_lakes = false          # lakes only via passage corridors or force_navigable overrides
# Sea components (water connected to a sea cell, with all passages allowed)
# smaller than this are dropped like ponds. The conservative raster cuts small
# pieces off the sea (pockets behind a gap narrower than a cell, sea between
# piers); a terminal could snap into one and get a false no_route. 0.1 km²
# (10 ha, e.g. 300 m x 330 m) is far below anything a seagoing ship sails in on
# its own: the Caspian (371,000 km²) and dock basins behind locks (typically
# several tens of hectares and more) are kept, while the cut-off fragments, a
# few to a few hundred 18-35 m cells (0.0003-0.1 km²), are dropped.
# The router also re-snaps a leg whose ends lie in different components (see
# core::route), so a kept basin never causes a false no_route either.
min_sea_component_km2 = 0.1

[harbour]
ferry_terminal_buffer_m = 500  # buffer around amenity=ferry_terminal that gets harbour detail
harbour_point_buffer_m = 500   # buffer around harbour points (harbour=yes nodes etc.) and extra_points
# extra_points = [[lon, lat], ...]  # additional points that get harbour detail

[routing]
shore_preferred_distance_m = 3704  # ~2 nm; closer cells get a cost multiplier
shore_penalty_max = 3.0            # multiplier at the shore

[sources]
water_polygons = "sources/water-polygons-split-4326"
land_polygons = "sources/land-polygons-split-4326"  # only used by the test oracle
osm_filtered = "sources/osm-filtered.geojsonseq"
passages = "data/passages.geojson"
overrides = "data/overrides.geojson"
