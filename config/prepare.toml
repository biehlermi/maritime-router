# Parameters for `maritime-router-prepare build`.
# Every value here is hashed into the data file header, so a data file always
# records exactly how it was built. Defaults are start values, tuned in Phase 1.

[region]
# Bounding box to build: [min_lon, min_lat, max_lon, max_lat] in WGS84 degrees.
# Omit for a global build.
# bbox = [-75.0, 35.0, 32.0, 72.0]
# More boxes for a multi-region build (the region is the union of all boxes;
# `--bbox` on the command line replaces them all).
# bboxes = [[-6.5, 48.5, 31.5, 71.5], [-75.0, 38.5, -6.5, 56.0]]

[grid]
# Cell size limits (metres). Cells are split while they contain both water and
# land, down to the minimum size allowed for their region.
ocean_min_cell_m = 2400        # open ocean beyond the coastal band
coastal_min_cell_m = 38        # within the coastal band, inland and passage water
harbour_min_cell_m = 19        # inside harbour areas and around extra points
max_cell_km = 40               # cap on leaf size, keeps the cell-centre graph a good metric
coastal_band_km = 20           # distance from land where coastal detail applies
cells_across_channel = 4       # width-adaptive refinement: at least this many cells across any channel
tile_halo_m = 4000             # context around each ~40 km build tile; shore distances saturate here (>= shore_preferred_distance_m)

[water]
inland_min_width_m = 150       # inland water narrower than this is removed (morphological opening)
harbour_min_width_m = 30       # harbour water narrower than this is removed
include_lakes = false          # lakes only via passage corridors or force_navigable overrides
# Tidal flats are not navigable. The coastline (and so the sea polygon) is at
# mean high water, so flats that fall dry at low tide, such as the Wadden Sea
# from Den Helder to Esbjerg, are sea in the water polygons. With this set,
# OSM tidal flats (wetland=tidalflat, the usual tagging; natural=shoal|sand|mud
# with tidal=yes) block every pixel they touch, like a shore; the channels
# between them stay sea. Shoals without tidal=yes are submerged and stay
# navigable (there is no depth data).
exclude_tidal_flats = true
# Many Wadden harbours are reached through buoyed tidal channels that the flat
# polygons cover (Harlesiel, Neuharlingersiel, Neßmersiel, Neuwerk, Schlüttsiel
# ...). Along OSM fairway lines (waterway=fairway) a corridor this wide stays
# open through the flats; it reopens only flat pixels inside the water union,
# never land. 100 m is about the width of such a buoyed channel and gives two
# to three cells across at the coast level. 0 turns fairways off. Elsewhere,
# passage corridors and force_navigable overrides also win over flats.
tidal_fairway_width_m = 100
# Sea components (water connected to a sea cell, with all passages allowed)
# smaller than this are dropped like ponds. The conservative raster cuts small
# pieces off the sea (pockets behind a gap narrower than a cell, sea between
# piers); a terminal could snap into one and get a false no_route. 0.1 km²
# (10 ha, e.g. 300 m x 330 m) is far below anything a seagoing ship sails in on
# its own: the Caspian (371,000 km²) and dock basins behind locks (typically
# several tens of hectares and more) are kept, while the cut-off fragments, a
# few to a few hundred 18-35 m cells (0.0003-0.1 km²), are dropped.
# The router also re-snaps a leg whose ends lie in different components (see
# core::route), so a kept basin never causes a false no_route either.
min_sea_component_km2 = 0.1

[harbour]
ferry_terminal_buffer_m = 500  # buffer around amenity=ferry_terminal that gets harbour detail
harbour_point_buffer_m = 500   # buffer around harbour points (harbour=yes nodes etc.) and extra_points
# extra_points = [[lon, lat], ...]  # additional points that get harbour detail

[routing]
# Cost multipliers baked into the edge weights. Each is at least 1, so the
# geodesic distance stays an admissible A* heuristic; reported distances are
# always measured on the final geometry. A leaf's multiplier is
#   shore term  1 + (shore_penalty_max - 1) * (1 - shore / reach), reach = min(P, width / 2)
#   x narrow-water term  1 + (narrow_penalty_max - 1) * (1 - width / narrow_width_m)
# and on a ship route only ship_route_penalty_share of the excess over 1 is
# kept (crates/prepare/src/build/penalty.rs).
shore_preferred_distance_m = 3704  # P, ~2 nm: open water closer to land gets the shore term
shore_penalty_max = 3.0            # shore term at the shore
# In channels narrower than 2P the shore distance is measured against the local
# half-width, so the middle of a river, canal or fjord is cheapest and routes
# stay centred instead of cutting along the inside of every bend. With the
# absolute distance the middle of a 200 m canal was only 2 % cheaper than its
# bank, and fjords 2 km wide cost 2.4x even in the middle, which pushed routes
# out of the inner leads (Bergen).
centre_channels = true
# Narrow water costs extra even in the middle, so routes don't squeeze through
# every gap between skerries that saves a little distance: 1.6x at 200 m,
# 1.2x at 400 m, nothing from 500 m.
narrow_width_m = 500
narrow_penalty_max = 2.0
# Ship routes: OSM fairways for ships (waterway=fairway that are not canoe or
# kayak routes, small inland waterways of CEMT class 0-III or stated to be
# shallower than 5 m), recommended tracks (seamark:type=recommended_track, same
# depth rule) and traffic separation lanes (seamark:type=separation_lane). Water
# in a corridor this wide along them keeps only ship_route_penalty_share of its
# multiplier above 1, so routes follow buoyed channels (the Elbe past Cuxhaven,
# the Ambrose Channel) where they are mapped. Not on tidal flats that a tidal
# fairway corridor keeps open. 0 turns a kind off.
ship_fairway_width_m = 300         # about a main fairway's width (Elbe ~400 m, Ambrose ~600 m)
separation_lane_width_m = 1000     # TSS lanes are 1-3 nm wide; the line is the lane's centre
ship_route_penalty_share = 0.2

[sources]
water_polygons = "sources/water-polygons-split-4326"
land_polygons = "sources/land-polygons-split-4326"  # only used by the test oracle
osm_filtered = "sources/osm-filtered.geojsonseq"
passages = "data/passages.geojson"
overrides = "data/overrides.geojson"
