[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/biehlermi/maritime-router"
authors = ["Michael Biehler"]
publish = false

[workspace.dependencies]
maritime-router-core = { path = "crates/core" }
maritime-router-acceptance = { path = "crates/acceptance" }
maritime-router-prepare = { path = "crates/prepare" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
memmap2 = "0.9.11"
bytemuck = { version = "1.25.2", features = ["derive"] }
blake3 = "1.8.7"
tempfile = "3.27.0"
geo = "0.33.1"
rstar = "0.13.0"
serde-saphyr = "2.0.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
